name: Generate profile cards

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # One pass with no THEME generates every theme, including the
      # github_dark and default folders the README references. Running the
      # action twice does not work: each invocation replaces the whole
      # profile-summary-card-output directory rather than adding to it.
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -4
          EXCLUDE: "HTML,CSS,SCSS,Dockerfile"
          AUTO_PUSH: true
